name: Build Flowerie_bot

on:
  release:
    types: [created]

permissions:
  contents: write


jobs:


  build-desktop:

    strategy:
      fail-fast: false

      matrix:

        include:

          - os: ubuntu-latest
            name: linux-x64

          - os: ubuntu-24.04-arm
            name: linux-arm64

          - os: windows-latest
            name: windows-x64

          - os: windows-11-arm
            name: windows-arm64

          - os: macos-13
            name: macos-x64

          - os: macos-latest
            name: macos-arm64


    runs-on: ${{ matrix.os }}


    steps:


    - name: Checkout
      uses: actions/checkout@v5


    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"


    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install pyinstaller


    #
    # Full standalone build
    #
    - name: Build builtin library version
      run: |

        pyinstaller \
          --onefile \
          --name Flowerie_bot-${{ matrix.name }}-builtin \
          main.py


    #
    # Thin version
    #
    # Keeps Python imports external
    # Requires user installed dependencies
    #
    - name: Build portable version
      run: |

        pyinstaller \
          --onedir \
          --name Flowerie_bot-${{ matrix.name }}-portable \
          main.py


    - name: Prepare release files
      shell: bash
      run: |

        mkdir output

        cp dist/Flowerie_bot-${{ matrix.name }}-builtin* output/

        cp -r dist/Flowerie_bot-${{ matrix.name }}-portable output/


    - name: Upload desktop artifacts
      uses: actions/upload-artifact@v4
      with:

        name: Flowerie_bot-${{ matrix.name }}

        path: output/




  #
  # Termux ARM64 build
  #
  # Uses Termux proot environment
  # to generate Android-compatible executable
  #

  build-termux:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v5


    - name: Package Termux source

      run: |

        mkdir termux-package

        rsync -a \
          --exclude ".git" \
          --exclude ".github" \
          ./ \
          termux-package/Flowerie_bot/


        tar -czf \
          Flowerie_bot-termux-source.tar.gz \
          -C termux-package \
          Flowerie_bot



    - name: Upload Termux package

      uses: actions/upload-artifact@v4

      with:

        name: Flowerie_bot-termux-source

        path: Flowerie_bot-termux-source.tar.gz




  #
  # Release upload
  #

  release:


    needs:

      - build-desktop
      - build-termux


    runs-on: ubuntu-latest


    steps:


    - name: Download artifacts

      uses: actions/download-artifact@v4

      with:

        path: release



    - name: Upload release assets

      uses: softprops/action-gh-release@v2

      with:

        files: |

          release/**/*
