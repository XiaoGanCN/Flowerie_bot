name: Build Flowerie_bot

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:

  # Desktop builds
  build-desktop:

    strategy:
      fail-fast: false

      matrix:
        include:

          - os: ubuntu-latest
            name: linux-x64

          - os: ubuntu-24.04-arm
            name: linux-arm64

          - os: windows-latest
            name: windows-x64

          - os: windows-11-arm
            name: windows-arm64

          - os: macos-latest
            name: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:

    - name: Checkout
      uses: actions/checkout@v5


    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"


    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install pyinstaller


    - name: Build executable
      run: |
        pyinstaller \
          --onefile \
          --name Flowerie_bot \
          main.py


    - name: Package
      shell: bash
      run: |
        mkdir release

        cp dist/Flowerie_bot* release/

        cd release

        tar -czf ../Flowerie_bot-${{ matrix.name }}.tar.gz *


    - name: Upload release asset
      uses: softprops/action-gh-release@v2
      with:
        files: |
          Flowerie_bot-${{ matrix.name }}.tar.gz



  # Termux ARM64 package
  build-termux:

    runs-on: ubuntu-24.04-arm

    steps:

    - name: Checkout
      uses: actions/checkout@v5


    - name: Prepare Termux package
      run: |

        mkdir -p ../termux-package

        rsync -a \
          --exclude ".git" \
          --exclude ".github" \
          ./ \
          ../termux-package/Flowerie_bot/


        cd ../termux-package

        tar -czf \
          ../Flowerie_bot-termux-arm64.tar.gz \
          Flowerie_bot


    - name: Upload Termux package
      uses: softprops/action-gh-release@v2
      with:
        files: |
          Flowerie_bot-termux-arm64.tar.gz
