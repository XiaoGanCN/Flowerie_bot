name: Build Flowerie_bot

on:
  release:
    types: [created]

permissions:
  contents: write


jobs:


  build-desktop:


    strategy:
      fail-fast: false

      matrix:

        include:

          - os: ubuntu-latest
            name: linux-x64

          - os: ubuntu-24.04-arm
            name: linux-arm64

          - os: windows-latest
            name: windows-x64

          - os: windows-11-arm
            name: windows-arm64

          - os: macos-latest
            name: macos-arm64



    runs-on: ${{ matrix.os }}



    steps:


    - name: Checkout

      uses: actions/checkout@v5



    - name: Setup Python

      uses: actions/setup-python@v6

      with:

        python-version: "3.12"



    - name: Install dependencies

      run: |

        python -m pip install --upgrade pip

        python -m pip install -r requirements.txt

        python -m pip install pyinstaller



    - name: Build builtin version
      run: |
        python -m PyInstaller --onefile --name Flowerie_bot-${{ matrix.name }}-builtin main.py


    - name: Build portable version
      run: |
        python -m PyInstaller --onedir --name Flowerie_bot-${{ matrix.name }}-portable main.py


    #
    # Package output
    #

    - name: Package release files

      shell: python {0}

      run: |

        import os
        import shutil
        import zipfile
        from pathlib import Path


        name = "${{ matrix.name }}"

        dist = Path("dist")
        output = Path("output")

        output.mkdir(exist_ok=True)


        # Copy builtin executable

        for f in dist.glob(f"Flowerie_bot-{name}-builtin*"):

            shutil.copy(f, output / f.name)



        # Zip portable folder

        portable = dist / f"Flowerie_bot-{name}-portable"


        if portable.exists():

            archive = output / f"Flowerie_bot-{name}-portable.zip"

            with zipfile.ZipFile(
                archive,
                "w",
                zipfile.ZIP_DEFLATED
            ) as z:

                for file in portable.rglob("*"):

                    if file.is_file():

                        z.write(
                            file,
                            file.relative_to(dist)
                        )



    - name: Upload desktop artifact

      uses: actions/upload-artifact@v4

      with:

        name: Flowerie_bot-${{ matrix.name }}

        path: output/*





  #
  # Termux source package
  #

  build-termux:


    runs-on: ubuntu-latest



    steps:


    - name: Checkout

      uses: actions/checkout@v5



    - name: Create Termux build script

      shell: bash

      run: |

        cat > build-termux.sh <<'EOF'

        #!/data/data/com.termux/files/usr/bin/bash

        set -e


        pkg update -y


        pkg install -y \
          python \
          clang \
          rust



        python -m pip install --upgrade pip



        python -m pip install \
          -r requirements.txt \
          -i https://termux-user-repository.github.io/pypi/ \
          --extra-index-url https://pypi.tuna.tsinghua.edu.cn/simple \
          --only-binary pydantic-core,pydantic



        python main.py

        EOF


        chmod +x build-termux.sh




    - name: Package Termux source

      shell: bash

      run: |


        mkdir package


        rsync -a \
          --exclude ".git" \
          --exclude ".github" \
          ./ \
          package/Flowerie_bot/



        tar -czf \
          Flowerie_bot-termux-source.tar.gz \
          -C package \
          Flowerie_bot




    - name: Upload Termux artifact

      uses: actions/upload-artifact@v4

      with:

        name: Flowerie_bot-termux-source

        path: Flowerie_bot-termux-source.tar.gz






  #
  # Release upload
  #

  release:


    needs:

      - build-desktop
      - build-termux



    runs-on: ubuntu-latest



    steps:


    - name: Download artifacts

      uses: actions/download-artifact@v4

      with:

        path: release




    - name: Upload release assets

      uses: softprops/action-gh-release@v2

      with:

        files: |

          release/**/*.zip

          release/**/*.exe

          release/**/Flowerie_bot-*-builtin

          release/**/*.tar.gz
