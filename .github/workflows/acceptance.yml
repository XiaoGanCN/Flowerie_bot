name: Acceptance

# 只跟随 main 分支推送触发（避免标签推送导致同一 SHA 重复运行）
on:
  push:
    branches: [main]
  pull_request:

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio ruff
      - name: Run acceptance (start Web UI + HTTP + round-trip + pytest + ruff)
        run: python tests/acceptance_check.py
